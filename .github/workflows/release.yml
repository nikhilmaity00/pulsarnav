name: Build & Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Configure Release Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          REQUIRE_PRIVATE_SIGNING: ${{ vars.REQUIRE_PRIVATE_SIGNING }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] || [ -n "$RELEASE_STORE_PASSWORD" ] || [ -n "$RELEASE_KEY_ALIAS" ] || [ -n "$RELEASE_KEY_PASSWORD" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
              echo "::error::Partial release signing secrets configured. Set RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD together."
              exit 1
            fi
            KEYSTORE_PATH="${{ runner.temp }}/pulsarnav-private-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Configured private release signing keystore."
          else
            if [ "$REQUIRE_PRIVATE_SIGNING" = "true" ]; then
              echo "::error::vars.REQUIRE_PRIVATE_SIGNING is 'true' cleanly blocking release without private signing secrets."
              exit 1
            fi
            echo "::warning::RELEASE_KEYSTORE_BASE64 not set; release build will use the repository fallback keystore (app/keystore/pulsarnav-release.jks). Configure signing secrets and vars.REQUIRE_PRIVATE_SIGNING=true for private distribution."
          fi

      - name: Test, Lint & Build Release APK
        env:
          REQUIRE_PRIVATE_RELEASE_SIGNING: ${{ vars.REQUIRE_PRIVATE_SIGNING }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Cleanup Ephemeral Keystore
        if: always()
        run: |
          if [ -n "${RELEASE_STORE_FILE:-}" ] && [ -f "$RELEASE_STORE_FILE" ]; then
            rm -f "$RELEASE_STORE_FILE"
          fi

      - name: Prepare APK Asset
        id: prep
        run: |
          VERSION_NAME="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p release-artifacts

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            IS_PRERELEASE="false"
            PUBLISH_RELEASE="true"
            RELEASE_TITLE="PulsarNav ${RELEASE_TAG}"
            ASSET_BASE="PulsarNav-${RELEASE_TAG//\//-}"
          elif [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            PUBLISH_RELEASE="true"
            if [[ -n "$VERSION_NAME" ]] && ! git rev-parse -q --verify "refs/tags/v${VERSION_NAME}" >/dev/null; then
              RELEASE_TAG="v${VERSION_NAME}"
              IS_PRERELEASE="false"
              RELEASE_TITLE="PulsarNav v${VERSION_NAME}"
              ASSET_BASE="PulsarNav-v${VERSION_NAME}"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -f master-latest "$GITHUB_SHA"
              git push -f origin master-latest
              RELEASE_TAG="master-latest"
              IS_PRERELEASE="true"
              RELEASE_TITLE="PulsarNav Master Build (${SHORT_SHA})"
              ASSET_BASE="PulsarNav-master-latest"
            fi
          else
            PUBLISH_RELEASE="false"
            RELEASE_TAG=""
            IS_PRERELEASE="true"
            RELEASE_TITLE=""
            REF_CLEAN="${GITHUB_REF_NAME:-dev}"
            ASSET_BASE="PulsarNav-${REF_CLEAN//\//-}"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/${ASSET_BASE}.apk"
          (cd release-artifacts && sha256sum "${ASSET_BASE}.apk" > "${ASSET_BASE}.apk.sha256")

          {
            echo "publish_release=${PUBLISH_RELEASE}"
            echo "release_tag=${RELEASE_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: steps.prep.outputs.publish_release == 'true'
        with:
          tag_name: ${{ steps.prep.outputs.release_tag }}
          name: ${{ steps.prep.outputs.release_title }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prep.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.prep.outputs.is_prerelease != 'true' && 'true' || 'false' }}

      - name: Upload Artifact (Workflow Run)
        uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: PulsarNav-APK
          path: release-artifacts/*
